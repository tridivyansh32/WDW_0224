<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 1. For a long quote -->
    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <!-- 2. For a short quote -->
    <p>As he said, <q>Stay hungry, stay foolish.</q></p>

    <!-- 3. For a book name -->
    <p>Book: <cite>The Pragmatic Programmer</cite></p>
    
     <!-- 4. For abbreviation, full form will show on hover -->
    <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

    <!-- 5. For address -->
    <address>
        Contact: Admin Office <br>
        College Road, Delhi
    </address>

    <!-- 6. Old price cut, new price underlined -->
    <p><del>Old price 500</del> <ins>New price 400</ins></p>

   


</body>
</html>
