<!DOCTYPE html>
<html>
<head>
    <title>Assignment 18</title>
    <style>
        header, footer {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 15px;
        }
        table {
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>

        <section>
            <h2>Courses and Fees</h2>

           <table border="1" align="center" cellpadding="8" cellspacing="0">
                <caption>Available Courses</caption>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>₹90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>₹45,000</td>
                </tr>
            </table>
        </section>

        <section>
            <form method="post" action="submit.php">
                <fieldset>
                    <legend>Application Form</legend>

                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" required>
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="course">Course:</label><br>
                        <select id="course" name="course">
                            <option value="btech">B.Tech CSE</option>
                            <option value="bca">BCA</option>
                        </select>
                    </p>

                    <p>
                        <label for="statement">Statement:</label><br>
                        <textarea id="statement" name="statement" rows="4" cols="30"></textarea>
                    </p>

                    <p>
                        <input type="submit" value="Apply">
                    </p>

                </fieldset>
            </form>
        </section>

        

    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>

</body>
</html>
