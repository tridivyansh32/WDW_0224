<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 11</title>
</head>
<body>

    <!-- 1. Skip link, for keyboard users -->
    <a href="#main">Skip to main content</a>

    <!-- 2. Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Help</a>
    </nav>

    <!-- 3. Main content -->
    <main id="main">

        <!-- 4. Proper heading, only one h1 -->
        <h1>Accessible Page</h1>

        <!-- 5. Image with alt text -->
        <p>
            <img src="compus.jpg" alt="College campus" width="200">
            <button aria-label="Close image">X</button>
        </p>

        <!-- 6. Search form with label -->
        <form>
            <label for="search">Search:</label>
            <input type="text" id="search" name="search">
        </form>

    </main>

</body>
</html>
</body>
